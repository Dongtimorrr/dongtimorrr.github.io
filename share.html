<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GIFdot 공유</title>
</head>
<body>
  <button id="shareBtn">공유하기</button>
  <button id="copyBtn">링크 복사</button>

  <script>
    const targetUrl = "https://apps.apple.com/kr/app/id6759234948";

    document.getElementById("shareBtn").addEventListener("click", async () => {
      try {
        if (navigator.share) {
          await navigator.share({
            title: "GIFdot",
            text: "여러 영상을 한 번에 GIF(움짤)로 변환할 수 있는 쉽고 간편한 앱! GIFdot을 사용해보세요.",
            url: targetUrl
          });
        } else {
          await navigator.clipboard.writeText(targetUrl);
          alert("공유를 지원하지 않아 링크를 복사했습니다.");
        }
      } catch (error) {
        console.error(error);
      }
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(targetUrl);
      alert("링크가 복사되었습니다.");
    });
  </script>
</body>
</html>
