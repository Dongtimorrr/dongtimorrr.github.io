<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GIFdot 공유</title>
  <style>
    :root {
      --bg-1: #fff6ea;
      --bg-2: #ffe0cc;
      --card: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 255, 255, 0.72);
      --text: #1f1a17;
      --muted: #6c625b;
      --accent: #ff6f3d;
      --accent-strong: #ef4f1a;
      --accent-soft: #ffd4c4;
      --shadow: 0 24px 60px rgba(173, 84, 42, 0.16);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fffdf7 0%, transparent 32%),
        radial-gradient(circle at bottom right, #ffc9a9 0%, transparent 30%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 430px;
      position: relative;
    }

    .glow {
      position: absolute;
      inset: -18px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(255,140,89,0.28), transparent 34%),
        radial-gradient(circle at 60% 100%, rgba(255,194,158,0.38), transparent 34%);
      filter: blur(18px);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      padding: 24px;
      border-radius: var(--radius-xl);
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .hero {
      position: relative;
      padding: 22px;
      border-radius: 24px;
      background:
        linear-gradient(135deg, #ff8f64 0%, #ff6f3d 48%, #ffb05a 100%);
      color: white;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -56px;
      top: -54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      filter: blur(2px);
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.96), rgba(255,255,255,0.74));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.7),
        0 10px 24px rgba(155, 54, 11, 0.22);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .app-icon span {
      font-size: 28px;
    }

    .app-meta h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .app-meta p {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255,255,255,0.9);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
      position: relative;
      z-index: 1;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .content {
      padding-top: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    .headline {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.04em;
      font-weight: 850;
    }

    .desc {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.65;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
    }

    button:active {
      transform: scale(0.985);
    }

    .share-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: white;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      box-shadow: 0 18px 28px rgba(239, 79, 26, 0.24);
    }

    .share-btn:hover {
      box-shadow: 0 20px 34px rgba(239, 79, 26, 0.28);
    }

    .copy-btn {
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      color: var(--text);
      border: 1px solid rgba(31,26,23,0.08);
      font-size: 15px;
      font-weight: 700;
    }

    .foot {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
      text-align: center;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      color: var(--accent-strong);
      font-weight: 700;
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 18px; }
      .hero { padding: 18px; }
      .headline { font-size: 24px; }
      .app-meta h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="glow"></div>

    <section class="card">
      <div class="hero">
        <div class="hero-top">
          <div class="app-icon" aria-hidden="true">
            <span>🎞️</span>
          </div>
          <div class="app-meta">
            <h1>GIFdot</h1>
            <p>여러 영상을 한 번에 GIF(움짤)로 변환할 수 있는 쉽고 간편한 앱</p>
          </div>
        </div>

        <div class="chips">
          <div class="chip">Batch GIF</div>
          <div class="chip">Easy Edit</div>
          <div class="chip">Fast Export</div>
        </div>
      </div>

      <div class="content">
        <p class="eyebrow">Share App</p>
        <h2 class="headline">GIFdot을 바로 공유해보세요.</h2>
        <p class="desc">
          아래 버튼을 누르면 기기의 네이티브 공유 시트가 열립니다.
          공유를 지원하지 않는 환경에서는 링크를 자동으로 복사합니다.
        </p>

        <div class="actions">
          <button id="shareBtn" class="share-btn" type="button">
            <span>↗</span>
            <span>GIFdot 공유하기</span>
          </button>

          <button id="copyBtn" class="copy-btn" type="button">
            링크만 복사하기
          </button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
        <p class="foot">iPhone에서는 Safari에서 가장 자연스럽게 동작합니다.</p>
      </div>
    </section>
  </main>

  <script>
    const targetUrl = "https://apps.apple.com/kr/app/id6759234948";
    const statusEl = document.getElementById("status");

    const shareData = {
      title: "GIFdot",
      text: "여러 영상을 한 번에 GIF(움짤)로 변환할 수 있는 쉽고 간편한 앱! GIFdot을 사용해보세요.",
      url: targetUrl
    };

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function copyLink(showMessage = true) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(targetUrl);
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = targetUrl;
          textArea.style.position = "fixed";
          textArea.style.opacity = "0";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand("copy");
          document.body.removeChild(textArea);
        }

        if (showMessage) {
          setStatus("링크가 복사되었습니다.");
        }
      } catch {
        setStatus("복사에 실패했습니다. 아래 링크를 직접 복사해주세요.");
        window.prompt("이 링크를 복사하세요.", targetUrl);
      }
    }

    document.getElementById("shareBtn").addEventListener("click", async () => {
      setStatus("");

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error && error.name === "AbortError") {
            setStatus("");
            return;
          }
        }
      }

      await copyLink(true);
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      setStatus("");
      await copyLink(true);
    });
  </script>
</body>
</html>
